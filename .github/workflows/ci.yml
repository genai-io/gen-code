name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release bot triggers CI on release/vX.Y.Z branches this way:
  # workflow_dispatch runs always execute, unlike pull_request runs on
  # GITHUB_TOKEN-created PRs (which are gated behind manual approval).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - name: Install dev tools
        run: make install-format-tools install-lint-tools
      - name: Format check
        run: make format-check
      - name: Build
        run: make build-all
      - name: Unit + integration tests (merged coverage)
        run: make cover
      - name: Vet + lint + layer check
        run: make lint

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - name: Build
        run: go build ./cmd/san/
      - name: Test (cmd/san only — integration tests are Unix-only)
        run: go test -count=1 ./cmd/san/...
      - name: Smoke test — zip package
        run: |
          go build -o san.exe ./cmd/san/
          Compress-Archive -Path san.exe -DestinationPath san_windows_amd64.zip -Force
          Expand-Archive -Path san_windows_amd64.zip -DestinationPath extracted -Force
          .\extracted\san.exe version
